[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
